LABEL arch
TEXT HELP
Boot the MY LAST ARCH Linux install medium on BIOS.
It allows you to install MY LAST ARCH Linux or perform system maintenance.
ENDTEXT
MENU LABEL MY LAST ARCH Linux install medium (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% cow_spacesize=4G archisosearchuuid=%ARCHISO_UUID%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the MY LAST ARCH Linux install medium on BIOS with speakup screen reader.
It allows you to install MY LAST ARCH Linux or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL MY LAST ARCH Linux install medium (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% cow_spacesize=4G archisosearchuuid=%ARCHISO_UUID% accessibility=on
